<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studicorix — Révisions Technologie lunette</title>
<style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#1e293b;background:#f4f7fb}
*{box-sizing:border-box}body{margin:0;padding:28px 16px}main{max-width:760px;margin:auto}
h1{font-size:clamp(1.5rem,4vw,2rem);margin:0 0 8px}p{color:#64748b;margin:0 0 24px;line-height:1.5}
.group{border:1px solid #dbe3ee;border-radius:12px;background:white;margin:10px 0;overflow:hidden;box-shadow:0 2px 6px #1725540a}
.group>button{width:100%;border:0;background:white;padding:17px 18px;display:flex;align-items:center;gap:12px;text-align:left;cursor:pointer;color:#172554;font-size:1.04rem;font-weight:650}
.group>button:hover,.group>button[aria-expanded=true]{background:#eef4ff}
.number{width:32px;height:32px;border-radius:9px;background:#dbeafe;color:#1d4ed8;display:grid;place-items:center;flex:none;font-size:.9rem}
.name{flex:1;min-width:0}.chevron{font-size:1.15rem;transition:transform .15s}.group>button[aria-expanded=true] .chevron{transform:rotate(180deg)}
.links{display:none;padding:3px 16px 17px;border-top:1px solid #e2e8f0;gap:10px;grid-template-columns:repeat(3,minmax(0,1fr))}.links.open{display:grid}
a.action{display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;border:1px solid #bfd4f9;border-radius:9px;background:#f8fbff;color:#1e40af;min-height:49px;padding:10px 8px;font-weight:600;font-size:.93rem}
a.action:hover{background:#dbeafe}.group.general{border-color:#a5b4fc}.group.general>button{background:#f3f5ff}.group.general .number{background:#c7d2fe;color:#3730a3}button:focus-visible,a:focus-visible{outline:3px solid #2563eb;outline-offset:2px}
@media(max-width:490px){.links{grid-template-columns:1fr}body{padding:20px 12px}}
</style>
</head>
<body>
<main>
<h1>Studicorix · Technologie lunette</h1>
<p>Choisis un groupe ou une révision générale pour afficher les trois modes de révision. Les exercices s'ouvrent dans un nouvel onglet.</p>
<div id="groups"></div>
</main>
<script>
'use strict';
const base='https://jeanjpaul59.github.io/lexiry-quiz/';
const groups=[
 ['Lumière et images','lumiere_et_images'],
 ['Vision et amétropies','vision_et_ametropies'],
 ['Astigmatisme','astigmatisme'],
 ['Géométrie des verres','geometrie_des_verres'],
 ['Puissances et distances focales','puissances_et_distances_focales'],
 ['Matériaux et dispersion','materiaux_et_dispersion'],
 ['Aberrations','aberrations'],
 ['Bases et conception des verres','bases_et_conception_des_verres'],
 ['Révision générale — Technologie lunette','technologie_lunette_—_revision_generale'],
 ['Révision générale — Technologie lunette (Test aléatoire)','technologie_lunette_revision_generale_(test_aleatoire)']
];
const modes=[['Quiz','quizv61'],['Drill','drillv1'],['Cartes','cards']];
const container=document.getElementById('groups');
for(const [index,[label,slug]] of groups.entries()){
 const section=document.createElement('section');section.className=index>=8?'group general':'group';
 const toggle=document.createElement('button');toggle.type='button';toggle.setAttribute('aria-expanded','false');toggle.setAttribute('aria-controls',`links-${index}`);
 const num=document.createElement('span');num.className='number';num.textContent=index>=8?'★':String(index+1);
 const name=document.createElement('span');name.className='name';name.textContent=label;
 const arrow=document.createElement('span');arrow.className='chevron';arrow.textContent='⌄';arrow.setAttribute('aria-hidden','true');
 toggle.append(num,name,arrow);
 const links=document.createElement('div');links.id=`links-${index}`;links.className='links';
 for(const [mode,suffix] of modes){
  const a=document.createElement('a');a.className='action';a.href=`${base}${encodeURIComponent(slug)}_debutant_${suffix}.html`;a.target='_blank';a.rel='noopener noreferrer';a.textContent=mode;links.appendChild(a);
 }
 toggle.addEventListener('click',()=>{
  const expand=toggle.getAttribute('aria-expanded')!=='true';
  for(const s of container.querySelectorAll('.group')){s.querySelector('button').setAttribute('aria-expanded','false');s.querySelector('.links').classList.remove('open')}
  if(expand){toggle.setAttribute('aria-expanded','true');links.classList.add('open')}
 });
 section.append(toggle,links);container.appendChild(section);
}
</script>
</body>
</html>
