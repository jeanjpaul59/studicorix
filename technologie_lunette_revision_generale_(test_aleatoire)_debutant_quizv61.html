<!DOCTYPE html>
<html lang='fr'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>Technologie lunette — Révision générale (test aléatoire)</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; background: #f7f7f7; color: #222; }
    .wrap { max-width: 1180px; margin: 0 auto; }
    h1 { margin-bottom: 6px; line-height: 1.2; }
    .subtitle { color: #666; margin-bottom: 18px; }
    .toolbar-top { margin-bottom: 18px; display: flex; gap: 10px; flex-wrap: wrap; }
    .toolbar-top button { padding: 12px 16px; font-size: 15px; cursor: pointer; }
    .card { background: #fff; border: 1px solid #ddd; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .topline { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
    .counter { font-size: 18px; color: #444; }
    .question-label, .answer-label { font-weight: bold; font-size: 16px; margin-bottom: 8px; }
    .grid2 { display: grid; grid-template-columns: 1.15fr 1fr; gap: 18px; }
    .panel { border: 1px solid #d8d8d8; border-radius: 10px; padding: 18px; min-height: 180px; background: #fafafa; }
    .question-panel { min-height: 220px; }
    .answer-panel { min-height: 180px; }
    .question { font-size: clamp(24px, 2.4vw, 34px); font-weight: bold; line-height: 1.35; word-break: normal; overflow-wrap: anywhere; white-space: pre-wrap; }
    .question.long-question { font-size: clamp(20px, 1.9vw, 28px); font-weight: 600; line-height: 1.45; }
    .speak-btn { padding: 6px 10px; font-size: 18px; cursor: pointer; border-radius: 8px; border: 1px solid #bbb; background: #f1f1f1; }
    .note { margin-top: 12px; color: #1f4e79; font-size: 18px; line-height: 1.4; }
    .answer-wrap { display: flex; gap: 10px; align-items: stretch; }
    .answer-main { flex: 1; }
    textarea.answer-input { width: 100%; min-height: 150px; padding: 14px; font-family: Arial, sans-serif; font-size: 20px; line-height: 1.45; border: 1px solid #bbb; border-radius: 8px; box-sizing: border-box; resize: vertical; overflow-y: auto; }
    .help-btn { width: 64px; min-width: 64px; border: 1px solid #7ea1c9; background: #dfeaf8; border-radius: 8px; font-size: 28px; cursor: pointer; }
    .help-btn:disabled { opacity: 0.5; cursor: default; }
    .info-row { margin-top: 18px; display: grid; grid-template-columns: repeat(4, minmax(120px, 1fr)); gap: 12px; }
    .info-box { border: 1px solid #ddd; background: #fafafa; border-radius: 8px; padding: 10px 12px; }
    .info-label { color: #666; font-size: 13px; margin-bottom: 4px; }
    .info-value { font-size: 20px; }
    .review-yes { color: #b00020; font-weight: bold; }
    .review-no { color: #0a7a20; font-weight: bold; }
    .nav-row { margin-top: 18px; display: grid; grid-template-columns: 1fr 160px 1fr; gap: 10px; align-items: center; }
    .nav-row button { padding: 14px 18px; font-size: 18px; min-height: 52px; cursor: pointer; }
    .langpair { text-align: center; border: 1px solid #ddd; background: #fafafa; border-radius: 8px; padding: 14px 10px; font-size: 20px; }
    .status-line { margin-top: 14px; min-height: 28px; font-size: 16px; }
    .warn { color: #9a6700; font-weight: bold; }
    .ok { color: #0a7a20; font-weight: bold; }
    .done { text-align: center; padding: 36px; }
    .done h2 { margin-bottom: 16px; }
    .done .big { font-size: 28px; font-weight: bold; margin-bottom: 18px; }
    @media (max-width: 760px) {
      body { margin: 12px; }
      .grid2 { grid-template-columns: 1fr; }
      .question { font-size: 24px; }
      .question.long-question { font-size: 20px; }
      textarea.answer-input { min-height: 130px; font-size: 18px; }
      .info-row { grid-template-columns: 1fr 1fr; }
      .nav-row { grid-template-columns: 1fr; }
      .langpair { order: -1; }
      .toolbar-top button { width: 100%; }
    }
  </style>
</head>
<body>
  <div class='wrap'>
    <h1>Technologie lunette — Révision générale (test aléatoire)</h1>
    <div class='subtitle'>FR-FR</div>
    <div class='toolbar-top'>
      <button onclick='restartSession()'>Recommencer cette session</button>
      <button onclick='reviewPending()'>Revoir éléments non validés</button>
      <button onclick='shuffleQuestions()'>Mélanger les questions</button>
      <button onclick='resetProgress()'>Réinitialiser la progression</button>
    </div>
    <div class='card' id='quizCard'></div>
  </div>
  <script>
    const quizId = 11;
    const storageKey = 'lexiry_typing_' + quizId;
    const orderKey = storageKey + '_order';
    const items = [
      {id: 271, q: "Verre bi asphérique", a: "Le verre bi-asphérique est un verre de haute performance dont la courbure est optimisée sur les deux faces (avante et arrière), contrairement au verre asphérique classique qui ne l’est que sur une seule face.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 41},
      {id: 272, q: "Faisceau lumineux", a: "Un faisceau lumineux est constitué d’un ensemble de rayons lumineux. Il est représenté par ses deux rayons extrêmes.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 23},
      {id: 273, q: "Verre biconcave", a: "Sauf dans le cas particulier du verre biconcave qui possède 2 faces concaves.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 15},
      {id: 274, q: "Hypermétropie", a: "L’hypermétropie est un défaut visuel causé le plus souvent par un œil « trop court » (longueur axiale < 23mm).", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 22},
      {id: 275, q: "Distorsion", a: "La distorsion est une aberration géométrique qui affecte la perception des formes à travers un verre optique, sans pour autant altérer la netteté de l’image.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 31},
      {id: 276, q: "Mesure de la réfraction", a: "La mesure de la réfraction d’un œil consiste à mesurer la puissance du système optique (lunette ou lentilles) qu’il faut ajouter à l’œil pour qu’une image à l’infini se forme précisément sur la rétine.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 40},
      {id: 277, q: "Droite focale", a: "Lorsqu’un faisceau de rayons parallèles passe à travers un dioptre cylindrique les rayons vont converger en une droite, appelée droite focale.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 28},
      {id: 278, q: "Grand et petit méridiens", a: "Le grand méridien a un rayon de courbure élevé, le petit méridien à un faible rayon de courbure. De l’importance du rayon de courbure dépend la convergence de la cornée. Le petit méridien est très convergent, alors que le grand méridien est moins convergent.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 51},
      {id: 279, q: "Astigmatisme des faisceaux obliques", a: "Lorsqu’un faisceau de lumière traverse obliquement une surface sphérique, le faisceau émergeant présente un astigmatisme, donc deux méridiens de puissance.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 31},
      {id: 280, q: "Verre périscopique", a: "On appelle un verre périscopique, un verre dont l’une des faces est plane ou concave et l’autre convexe, donnant un champ visuel une grande étendue.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 29},
      {id: 281, q: "Puissance focale", a: "La puissance focale désigne la vergence ou puissance d’un système optique (comme le verre).", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 18},
      {id: 282, q: "Aberration", a: "Une aberration est un défaut du système optique qui conduit à la déformation des images.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 17},
      {id: 283, q: "Distorsion en coussinet", a: "Les lignes droites se courbent vers l’interieur, rappelant la forme d’un cousin ou d ’un oreiller.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 19},
      {id: 284, q: "Cercle de moindre diffusion", a: "Les 2 segments des droites reproduits sont les diamètres extrêmes de la forme ellipsoïdale : entre eux, il existe un endroit où la section du faisceau est circulaire. Ce cercle représente une image semblable mais floue du point objet et est appelé \"cercle de moindre diffusion\".", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 55},
      {id: 285, q: "Solution de Wollaston", a: "Solution de Wollaston : Verres très cambrés (très bombés), offrant la meilleure qualité optique mais peu esthétiques.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 23},
      {id: 286, q: "Géométrie atorique", a: "On l’appelle \"atorique\" car sa géométrie s’écarte de la toricité simple pour corriger les aberrations latérales.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 22},
      {id: 287, q: "Aberration chromatique transversale", a: "Aberration chromatique transversale (latérale) : les couleurs sont décalées latéralement dans l’image.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 20},
      {id: 288, q: "Verre de Tscherning", a: "Le verre de Tscherning est une forme spécifique de verre ménisque dont les courbures son calculées pour éliminer l’astigmatisme des faiscaux obliques, offrant ainsi une vision nette même en regardant sur les côtés du verre.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 44},
      {id: 289, q: "Verres asphériques", a: "On appelle verres asphériques, des verres dont la face frontale est corrigée de l’astigmatisme des faisceaux obliques, permettant de réaliser des verres très plats", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 32},
      {id: 290, q: "Faisceau cylindrique ou parallèle", a: "Si les rayons de lumière restent parallèles, le faisceau est cylindrique ou parallèle.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 17},
      {id: 291, q: "Œil amétrope", a: "L’œil amétrope est un œil optiquement imparfait : l’accommodation au repos, l’image d’un objet éloigné ne converge pas au centre de la rétine sur la macula.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 31},
      {id: 292, q: "Astigmatisme myopique simple", a: "AST myopique simple : un des deux axes est myope, CAD se concentre devant la rétine et l’autre se concentre sur la rétine.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 24},
      {id: 293, q: "Verre minéral", a: "Le verre minéral est un matériau issu du sable de silice, ce qui lui confère une grande pureté et en fait un matériau idéal pour la réalisation de verres optiques de qualité supérieure.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 37},
      {id: 294, q: "Distance focale", a: "La distance focale (ou longueur focale) est celle qui sépare le centre optique d’une lentille de son foyer image.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 22},
      {id: 295, q: "Ellipse de Tscherning", a: "L’Ellipse de Tscherning : C’est une courbe mathématique qui indique, pour chaque puissance de verre, les deux courbures de base idéales possibles.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 29},
      {id: 296, q: "Distorsion en barillet", a: "Les lignes droites se courbent vers l’exterieur, donnant à l’image carré ou rectangulaire la forme d’un tonneau (un barillet).", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 25},
      {id: 297, q: "Nombre d’Abbe", a: "Le nombre d’Abbe est la valeur indiquant la tendance d’une matière à séparer les couleurs.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 18},
      {id: 298, q: "Image virtuelle", a: "Une image est virtuelle lorsqu’elle ne peut se former sur un écran.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 13},
      {id: 299, q: "Réfraction", a: "Lorsque la lumière passe d’un milieu à un autre sa direction se modifie : ce phénomène de déviation est appelé réfraction.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 24},
      {id: 300, q: "Aberration de sphéricité", a: "L’aberration sphérique naît d’une différence de mise au point entre les rayons provenant du centre de l’optique et ceux en provenance du bord.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 28},
      {id: 301, q: "Astigmatisme composé hypermétropique", a: "AST composé hypermétropique : lorsque les axes yeux sont hypermétropes, CAD qu’ils se concentrent derrière la rétine.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 23},
      {id: 302, q: "Constringence", a: "Appelé aussi \"Constringence\", ce terme défini la capacité d’une matière transparente à décomposer la lumière blanche.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 23},
      {id: 303, q: "Verre atorique", a: "Un verre optique atorique est un verre de haute tech conçu pour corriger l’astigmatisme de manière bcp plus précise qu’un verre torique standard.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 29},
      {id: 304, q: "Solution d’Ostwalt", a: "Solution d’Ostwalt : Verres moins cambrés, plus plats et donc plus courants en lunetterie moderne.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 19},
      {id: 305, q: "Géométrie du verre", a: "La géométrie d’un verre en optique désigne la forme et les dimensions physiques du verre, qui influencent la manière dont il réfracte, réfléchit et transmet la lumière.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 33},
      {id: 306, q: "Puissance sphérométrique", a: "La puissance sphérométrique d’un verre : DS = D1 + D2 Cette puissance ne tient pas compte de l’épaisseur du verre.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 22},
      {id: 307, q: "Aberration chromatique longitudinale", a: "Aberration chromatique longitudinale (axiale) : différentes couleurs ont des plans de mise au point à des distances différentes.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 25},
      {id: 308, q: "Verre plan concave", a: "Ou du verre plan-concave qui possède une face plane et une face concave.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 14},
      {id: 309, q: "Appairage des bases", a: "Si les 2 yeux ont des corrections très différentes, l’opticien peut demander une base spéciale pour harmoniser l’aspect esthétique des 2 verres (même cambrure visuelle). C’est ce que l’on appelle un \"Appairage des bases\".", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 44},
      {id: 310, q: "Astigmatisme mixte", a: "Lorsqu’un axe est myope et l’autre hypermétrope, CAD qu’un axe se concentre devant la rétine et l’autre derrière.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 22},
      {id: 311, q: "Indice de réfraction", a: "On appelle indice de réfraction n d’un milieu, le rapport entre la vitesse de propagation V de la lumière dans l’air et la vitesse de propagation Vn de la lumière dans ce milieu.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 35},
      {id: 312, q: "Centre optique", a: "Sur le 1er schéma, on distingue le centre de la lentille, appelé centre optique, O, ainsi qu’une droite imaginaire appelée axe optique, perpendiculaire à la lentille et passant par O.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 36},
      {id: 313, q: "Verre ponctuel", a: "On appelle verre ponctuel, un verre dont la face frontale est sphérique et dont la base est choisie suffisament cambrée pour corriger en partie l’astigmatisme des faisceaux obliques.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 36},
      {id: 314, q: "Presbytie", a: "la presbytie n’est pas une amétropie mais un trouble de l’accommodation, qui concerne la vision de près et non pas la vision de loin", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 26},
      {id: 315, q: "Astigmatisme régulier", a: "Ce type d’astigmatisme se caractérise par la déformation de la cornée dans un seul axe.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 17},
      {id: 316, q: "Dioptre sphérique", a: "On appelle \"dioptre sphérique\" une surface sphérique séparant 2 millieux d’indice différent (l’air et le verre en lunetterie).", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 25},
      {id: 317, q: "Base du verre", a: "La base du verre (ou courbure de base) est la puissance exprimée en dioptries de la face frontale du verre (face convexe). Elle définit le galbe ou la cambrure du verre.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 33},
      {id: 318, q: "Rayons lumineux", a: "Les rayons lumineux sont des droites représentant le trajet de la lumière.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 14},
      {id: 319, q: "Verre ménisque", a: "On appelle verre ménisque, un verre dont le dioptre avant est convexe et le dioptre arrière est concave.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 20},
      {id: 320, q: "Correction torique", a: "Un verre, une lentille ou un implant torique sont constitués d’une sphère, d’un cylindre et d’un axe.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 20},
      {id: 321, q: "Faisceau convergent", a: "Si les rayons de lumière arrivent au même point, le faisceau est dit convergent.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 16},
      {id: 322, q: "Verre sphérique", a: "Un verre sphérique est un corps transparent limité par 2 surfaces sphériques dont les 2 faces sont des portions de sphères ou dont une face est sphérique et l’autre plane et qui ont la propriété de faire dévier les rayons lumineux par réfraction sur ces surfaces.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 52},
      {id: 323, q: "Astigmatisme", a: "L’astigmatisme est lié à un défaut de convergence de l’image au niveau de la rétine.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 16},
      {id: 324, q: "Foyers objet et image", a: "Sur le 2ème schéma, on a rajouté de part et d’autre de l’axe optique 2 points imaginaires, F et F’, respectivement foyer objet et foyer image.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 28},
      {id: 325, q: "Astigmatisme simple", a: "AST simple est celui dont l’une des lignes focales est situés sur la rétine (emmétrope) et l’autre en arrière ou en avant d’elle.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 25},
      {id: 326, q: "Astigmatisme", a: "L’astigmatisme est lié à un défaut de convergence de l’image au niveau de la rétine.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 16},
      {id: 327, q: "Astigmatisme indirect", a: "Dans ce cas, l’axe le plus cambré est l’horizontal (0°), le moins cambré vertical.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 16},
      {id: 328, q: "Technologie FreeForm", a: "La technologie FreeForm, point par point, qui nécessite des machines numériques de haute technologie couplées à des logiciels de calculs puissants.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 29},
      {id: 329, q: "Œil", a: "L’œil est un appareil optique qui forme sur la rétine une image des objets extérieurs.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 17},
      {id: 330, q: "Traitements hydrophobe et oléophobe", a: "Tel que le traitement hydrophobe qui réduit l’adhérence de l’eau et le traitement oléophobe qui empêche les corps gras de s’accrocher fermement à la surface minérale.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 33},
      {id: 331, q: "Verre plan convexe", a: "Et du verre plan-convexe qui possède une face plane et une face convexe.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 14},
      {id: 332, q: "Degré d’astigmatisme", a: "Le degré d’AST, exprimé en dioptries, est alors égal à la différence de vergence (puissance optique) entre les 2 méridiens principaux.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 26},
      {id: 333, q: "Addition", a: "L’addition c’est la puissance positive qu’il faut ajouter à la vision de loin pour corriger la vision de près.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 22},
      {id: 334, q: "Puissance frontale image", a: "La puissance frontale image est la puissance réellement utilisée en pratique par les opticiens pour caractériser un verre de lunette. ▪ Elle est mesurée par rapport à la face arrière (sommet arrière) du verre. ▪ C’est la valeur indiquée par un frontofocomètre.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 52},
      {id: 335, q: "Astigmatisme composé", a: "AST composé se produit lorsqu’aucune des lignes focales ne se repose sur la rétine et qu’aucun axe n’es emmétrope.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 22},
      {id: 336, q: "Dispersion", a: "La dispertion est la description d’une variation de l’indice de réfraction en fonction de la longueur d’onde.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 21},
      {id: 337, q: "Dioptrie", a: "Plus précisément, une dioptrie correspond à l’inverse de la distance focale (en mètres) de la lentille d’où V = 1/f’.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 23},
      {id: 338, q: "Astigmatisme composé myopique", a: "AST composé myopique : lorsque les 2 axes sont myopes, CAD qu’ils se concentrent devant la rétine.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 19},
      {id: 339, q: "Faces convexes et concaves", a: "Les faces d’un verre peuvent être convexes (\"bosses\") ou concaves (\"creux\").", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 15},
      {id: 340, q: "Courbure de champ", a: "La courbure de champ est un défaut optique où le plan d’image net n’est pas plat mais courbe (souvent convexe ou concave).", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 24},
      {id: 341, q: "Axe optique ou principal", a: "Les centres des sphères sont alignés sur une droite appelée axe optique.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 14},
      {id: 342, q: "Verre biconvexe", a: "Et du verre biconvexe qui possède 2 faces convexes", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 10},
      {id: 343, q: "Aberration longitudinale de sphéricité", a: "Dans le cas d’une lentille convergente, le foyer des rayons extrèmes est plus près de la lentille que le foyer des rayons centraux. La distance des deux foyers constitue l’aberration longitudinale de sphéricité.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 42},
      {id: 344, q: "Image réelle", a: "Une image réelle est obtenue lorsque les rayons lumineux se concentrent, ou convergent, sur un écran ou sur un mur. La rétine fait office d’écran.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 29},
      {id: 345, q: "Astigmatisme oblique", a: "On parle d’astigmatisme oblique lorsque les axes ne sont ni verticaux ni horizontaux (45°)", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 18},
      {id: 346, q: "Aberration chromatique", a: "L’aberration chromatique est un défaut d’un système optique où les différentes longueurs d’onde (couleurs) ne convergent pas au même point.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 27},
      {id: 347, q: "Astigmatisme irrégulier", a: "Dans les cas simples, les deux méridiens ne se croisent plus sur le même axe.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 15},
      {id: 348, q: "Accommodation visuelle", a: "L’accommodation visuelle est un mécanisme naturel de l’œil qui permet, en quelque sorte, de faire « une mise point automatique » et de voir net des objets à toutes les distances.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 35},
      {id: 349, q: "Punctum proximum PP", a: "Le punctum proximum (PP) est le point le plus proche que peut voir l’œil de façon nette en accommodant.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 20},
      {id: 350, q: "Astigmatisme hypermétropique simple", a: "AST hypermétropique simple : un des 2 axes est hypermétrope, CAD se concentre derrière la rétine et l’autre se concentre sur la rétine.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 27},
      {id: 351, q: "Verre organique", a: "Le verre organique, quant à lui, est issu de la synthèse chimique de composés issus du pétrole.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 19},
      {id: 352, q: "Calotte sphérique", a: "La calotte d’un verre sphérique (ou calotte sphérique) est la portion de surface d’une sphère délimitée par un plan.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 23},
      {id: 353, q: "Coma", a: "D’autre part pour des incidences obliques, cette abérration se manifeste par une traînées lumineuse dissymétrique appelée \"coma\".", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 25},
      {id: 354, q: "Myopie", a: "L’œil d’une personne myope forme un objet observé en avant de la rétine au point (f).", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 17},
      {id: 355, q: "Dispersion chromatique", a: "La dispersion chromatique en lunetterie est un phénomène optique où le verre décompose la lumière blanche en couleurs, créant des franges colorées (aberrations chromatiques) et une vision floue, particulièrement en périphérie.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 45},
      {id: 356, q: "Punctum remotum PR", a: "Le punctum remotum (PR) est défini par le point le plus éloigné que peut voir l’œil de façon nette à l’infini pour l’œil emmétrope et sans aucun effort d’accommodation.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 33},
      {id: 357, q: "Vergence", a: "En termes simples, la vergence représente la puissance d’une lentille, définie par son aptitude à faire converger ou diverger des rayons lumineux.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 29},
      {id: 358, q: "Dioptre", a: "Un dioptre est une surface séparant 2 millieux d’indices de réfraction différents.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 16},
      {id: 359, q: "Faisceau divergent", a: "Si les rayons de lumière partent d’un même point, le faisceau est divergent.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 15},
      {id: 360, q: "Astigmatisme direct", a: "L’axe le plus cambré est vertical (90), le moins cambré horizontal.", note: "", levelId: 1, levelName: "Débutant", charsPerAllowedError: 5, allowedErrors: 13}
    ];
    let currentItems = [...items];
    let currentIndex = 0;
    let currentMode = 'all';
    let savedResults = JSON.parse(localStorage.getItem(storageKey) || '{}');
    function speak(text) {
      if (!text) return;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ru-RU';
      speechSynthesis.speak(utterance);
    }
    function saveResults() {
      localStorage.setItem(storageKey, JSON.stringify(savedResults));
    }
    function saveOrder() {
      localStorage.setItem(orderKey, JSON.stringify(currentItems.map(item => item.id)));
    }
    function loadSavedOrder() {
      const savedOrder = JSON.parse(localStorage.getItem(orderKey) || 'null');
      if (!savedOrder || !Array.isArray(savedOrder) || savedOrder.length !== items.length) return false;
      const map = new Map(items.map(item => [item.id, item]));
      const reordered = savedOrder.map(id => map.get(id)).filter(Boolean);
      if (reordered.length !== items.length) return false;
      currentItems = reordered;
      return true;
    }
    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }
    function getDefaultState(item) {
      return {
        userAnswer: '',
        errorCount: 0,
        helpCount: 0,
        isCorrect: false,
        isMarkedForReview: true,
        status: 'unanswered'
      };
    }
    function getState(item) {
      if (!savedResults[item.id]) {
        savedResults[item.id] = getDefaultState(item);
      }
      return savedResults[item.id];
    }
    function recomputeState(item) {
      const st = getState(item);
      const isCorrect = (normalizeForComparison(st.userAnswer) === normalizeForComparison(item.a));
      st.isCorrect = isCorrect;
      if (isCorrect) {
        st.isMarkedForReview = (st.errorCount > item.allowedErrors);
        st.status = st.isMarkedForReview ? 'review' : 'correct';
      } else {
        st.isMarkedForReview = true;
        st.status = (st.userAnswer === '') ? 'unanswered' : 'partial';
      }
      saveResults();
    }
    function getPendingItems() {
      return items.filter(item => {
        const st = getState(item);
        return !(st.isCorrect === true && st.isMarkedForReview === false);
      });
    }
    function getValidCount() {
      return items.filter(item => {
        const st = getState(item);
        return st.isCorrect === true && st.isMarkedForReview === false;
      }).length;
    }
    function getCorrectCount() {
      return items.filter(item => getState(item).isCorrect === true).length;
    }
    function getStartedCount() {
      return items.filter(item => getState(item).userAnswer !== '').length;
    }
    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
    function renderQuestion() {
      const card = document.getElementById('quizCard');
      if (currentItems.length === 0) { renderEmpty(); return; }
      if (currentIndex < 0) currentIndex = 0;
      if (currentIndex >= currentItems.length) { renderDone(); return; }
      const item = currentItems[currentIndex];
      const st = getState(item);
      const questionClass = item.q.length > 90 ? 'question long-question' : 'question';
      recomputeState(item);
      card.innerHTML =
        '<div class="topline">' +
          '<div class="counter">Question ' + (currentIndex + 1) + ' / ' + currentItems.length + '</div>' +
          '<div class="counter">Validés : ' + getValidCount() + ' / ' + items.length + ' — Commencés : ' + getStartedCount() + ' / ' + items.length + '</div>' +
        '</div>' +
        '<div class="grid2">' +
          '<div>' +
            '<div class="question-label">Question</div>' +
            '<div class="panel question-panel"><div class="' + questionClass + '">' + escapeHtml(item.q) + '</div>' + (item.note ? '<div class="note">[' + escapeHtml(item.note) + ']</div>' : '') + '</div>' +
          '</div>' +
          '<div>' +
            '<div class="answer-label">Réponse</div>' +
            '<div class="panel answer-panel"><div class="answer-wrap"><div class="answer-main"><textarea class="answer-input" id="userAnswer" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="text">' + escapeHtml(st.userAnswer) + '</textarea></div><button class="help-btn" id="btnHelp" title="Révéler le caractère suivant">?</button></div><div class="status-line" id="statusLine"></div></div>' +
          '</div>' +
        '</div>' +
        '<div class="nav-row">' +
          '<button id="btnPrev">&lt;-- Précédent</button>' +
          '<div class="langpair">' + escapeHtml('FR-FR') + '</div>' +
          '<button id="btnNext">Suivant --&gt;</button>' +
        '</div>' +
        '<div class="info-row">' +
          '<div class="info-box"><div class="info-label">Nb d’erreurs</div><div class="info-value" id="errorCount">' + st.errorCount + '</div></div>' +
          '<div class="info-box"><div class="info-label">Nb d’erreurs autorisées</div><div class="info-value">' + item.allowedErrors + '</div></div>' +
          '<div class="info-box"><div class="info-label">Tolérance d’erreurs</div><div class="info-value">' + escapeHtml(item.levelName || '') + '</div></div>' +
          '<div class="info-box"><div class="info-label">À revoir</div><div id="reviewFlag" class="info-value ' + (st.isMarkedForReview ? 'review-yes' : 'review-no') + '">' + (st.isMarkedForReview ? 'Oui' : 'Non') + '</div></div>' +
        '</div>';
      const input = document.getElementById('userAnswer');
      const btnHelp = document.getElementById('btnHelp');
      const btnPrev = document.getElementById('btnPrev');
      const btnNext = document.getElementById('btnNext');
      const btnSpeakQuestion = document.getElementById('btnSpeakQuestion');
      if (btnSpeakQuestion) btnSpeakQuestion.addEventListener('click', function() { st.errorCount += 1; recomputeState(item); updateStatusLine(); speak(item.a); });
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
      btnPrev.disabled = (currentIndex === 0);
      btnHelp.disabled = st.isCorrect || st.userAnswer.length >= item.a.length;
      updateStatusLine();
      input.addEventListener('paste', function(e) { e.preventDefault(); });
      let isComposing = false;
      input.addEventListener('compositionstart', function() { isComposing = true; });
      input.addEventListener('compositionend', function() { isComposing = false; handleTyping(item); });
      input.addEventListener('input', function(e) { if (!isComposing && !e.isComposing) handleTyping(item); });
      btnHelp.addEventListener('click', function() {
        revealNextLetter(item);
      });
      btnPrev.addEventListener('click', function() { previousQuestion(); });
      btnNext.addEventListener('click', function() { nextQuestion(); });
    }
    function updateStatusLine() {
      const item = currentItems[currentIndex];
      if (!item) return;
      const st = getState(item);
      const el = document.getElementById('statusLine');
      if (!el) return;
      if (st.isCorrect) {
        el.innerHTML = '<span class="ok">Réponse complète.</span>';
      } else if (st.userAnswer !== '') {
        el.innerHTML = '<span class="warn">Réponse en cours.</span>';
      } else {
        el.innerHTML = '';
      }
      const err = document.getElementById('errorCount');
      const rev = document.getElementById('reviewFlag');
      const btnHelp = document.getElementById('btnHelp');
      if (err) err.textContent = st.errorCount;
      if (rev) {
        rev.textContent = st.isMarkedForReview ? 'Oui' : 'Non';
        rev.className = 'info-value ' + (st.isMarkedForReview ? 'review-yes' : 'review-no');
      }
      if (btnHelp) btnHelp.disabled = st.isCorrect || st.userAnswer.length >= item.a.length;
    }
    function normalizeForComparison(text) {
      return String(text || '').normalize('NFC')
        .replace(/[‘’'`´]/g, String.fromCharCode(39))
        .replace(/[\u00AB\u00BB\u201C\u201D\u201E\u201F]/g, String.fromCharCode(34))
        .replace(/[\u00A0\u202F]/g, ' ')
        .replace(/œ/g, 'oe').replace(/Œ/g, 'Oe')
        .replace(/\s*(")\s*/g, '$1')
        .replace(/\s+/g, ' ')
        .trim()
        .toLocaleLowerCase('fr');
    }
    function handleTyping(item) {
      const input = document.getElementById('userAnswer');
      const st = getState(item);
      const previous = st.userAnswer || '';
      const typed = input.value || '';
      if (typed === previous) return;
      if (typed.length < previous.length) {
        st.userAnswer = typed;
        recomputeState(item);
        updateStatusLine();
        return;
      }
      const normalizedTyped = normalizeForComparison(typed);
      const normalizedExpected = normalizeForComparison(item.a);
      if (normalizedExpected.startsWith(normalizedTyped) && normalizedTyped.length <= normalizedExpected.length) {
        let pos = 0;
        while (pos < item.a.length && normalizeForComparison(item.a.substring(0, pos + 1)).length <= normalizedTyped.length) pos++;
        const canonical = item.a.substring(0, pos);
        st.userAnswer = (canonical.length < typed.length && normalizeForComparison(canonical) === normalizedTyped) ? canonical : typed;
        input.value = st.userAnswer;
        input.setSelectionRange(input.value.length, input.value.length);
      } else {
        st.errorCount += 1;
        input.value = previous;
        input.setSelectionRange(previous.length, previous.length);
      }
      recomputeState(item);
      updateStatusLine();
    }
    function revealNextLetter(item) {
      const input = document.getElementById('userAnswer');
      const st = getState(item);
      if (st.isCorrect) return;
      const nextPos = st.userAnswer.length + 1;
      if (nextPos > item.a.length) return;
      st.userAnswer = item.a.substring(0, nextPos);
      st.errorCount += 1;
      st.helpCount += 1;
      input.value = st.userAnswer;
      input.setSelectionRange(st.userAnswer.length, st.userAnswer.length);
      recomputeState(item);
      updateStatusLine();
      input.focus();
    }
    function nextQuestion() {
      currentIndex += 1;
      renderQuestion();
    }
    function previousQuestion() {
      if (currentIndex > 0) {
        currentIndex -= 1;
        renderQuestion();
      }
    }
    function shuffleQuestions() {
      const currentId = currentItems[currentIndex] ? currentItems[currentIndex].id : null;
      currentMode = 'all';
      currentItems = [...items];
      if (currentItems.length > 1) {
        let attempts = 0;
        do {
          shuffleArray(currentItems);
          attempts += 1;
        } while (currentItems[0].id === currentId && attempts < 10);
      }
      currentIndex = 0;
      saveOrder();
      renderQuestion();
    }
    function restartSession() {
      if (!confirm('Recommencer la session depuis zéro ?')) return;
      items.forEach(item => {
        savedResults[item.id] = getDefaultState(item);
      });
      saveResults();
      currentMode = 'all';
      if (!loadSavedOrder()) currentItems = [...items];
      currentIndex = 0;
      renderQuestion();
    }
    function reviewPending() {
      const pendingItems = getPendingItems();
      if (pendingItems.length === 0) {
        alert('Tout est validé.');
        return;
      }
      pendingItems.forEach(item => {
        savedResults[item.id] = getDefaultState(item);
      });
      saveResults();
      currentMode = 'pending';
      currentItems = pendingItems;
      currentIndex = 0;
      renderQuestion();
    }
    function resetProgress() {
      if (!confirm('Effacer toute la progression mémorisée ?')) return;
      localStorage.removeItem(storageKey);
      localStorage.removeItem(orderKey);
      savedResults = {};
      currentItems = [...items];
      currentIndex = 0;
      currentMode = 'all';
      renderQuestion();
    }
    function renderDone() {
      const card = document.getElementById('quizCard');
      const sessionCorrectCount = currentItems.filter(item => getState(item).isCorrect === true).length;
      const sessionTotal = currentItems.length;
      const validCount = getValidCount();
      const pendingCount = getPendingItems().length;
      card.innerHTML =
        '<div class="done">' +
        '<h2>Session terminée</h2>' +
        '<div class="big">Mots trouvés dans cette session : ' + sessionCorrectCount + ' / ' + sessionTotal + '</div>' +
        '<div style="margin-bottom:10px;">Progression générale — Validés dans la tolérance : ' + validCount + ' / ' + items.length + '</div>' +
        '<div style="margin-bottom:20px;">Éléments à revoir : ' + pendingCount + '</div>' +
        '<button onclick="restartSession()">Recommencer cette session</button> ' +
        '<button onclick="reviewPending()">Revoir éléments non validés</button>' +
        '</div>';
    }
    function renderEmpty() {
      const card = document.getElementById('quizCard');
      card.innerHTML =
        '<div class="done">' +
        '<h2>Aucun élément à afficher</h2>' +
        '<button onclick="restartSession()">Revenir à la session complète</button>' +
        '</div>';
    }
    loadSavedOrder();
    saveOrder();
    renderQuestion();
  </script>
</body>
